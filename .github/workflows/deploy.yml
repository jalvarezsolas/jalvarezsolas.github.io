# Rebuilds the website and the CVA PDF on every push to "main" and publishes them.
name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the "Actions" tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and PDF libraries
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
