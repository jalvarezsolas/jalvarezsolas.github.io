cva_summary: |
  Mi investigación se centra en la dinámica de los mantos de hielo y su interacción con el océano y la atmósfera en climas glaciales, interglaciales y futuros, mediante modelos numéricos de distinta complejidad. Durante mi etapa en el Laboratoire des Sciences du Climat et de l'Environnement (LSCE, Francia) propuse que el calentamiento oceánico subsuperficial, y no solo las oscilaciones internas del manto Laurentino, desencadenó los eventos Heinrich (Alvarez-Solas et al., 2010, Nature Geoscience). Posteriormente he extendido este marco a la variabilidad milenaria de los mantos de hielo euroasiático, groenlandés y antártico durante el último periodo glacial.

  En la Universidad Complutense de Madrid y el Instituto de Geociencias (CSIC-UCM) he codesarrollado el modelo de manto de hielo Yelmo (Robinson et al., 2020), así como herramientas eficientes como FastIsostasy. Mis líneas actuales abordan los puntos de inflexión, la histéresis y la irreversibilidad de los mantos de hielo de Groenlandia y la Antártida (Gutiérrez-González et al., 2026; Blasco et al., 2024), el papel de la velocidad del calentamiento en el colapso del hielo marino antártico (Swierczek-Jereczek et al., 2026, Nature Geoscience) y el origen de los ciclos glaciales y la transición del Pleistoceno Medio (Pérez-Montero et al., 2025, 2026). Participo en el proyecto internacional de intercomparación de puntos de inflexión TIPMIP. TODO: financiación obtenida (proyectos como IP), liderazgo y colaboraciones internacionales.

