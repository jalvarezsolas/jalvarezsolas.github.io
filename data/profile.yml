# ---------- Part B. Resumen libre del currículum (max. 5000 characters) ----------
# Separate paragraphs with a blank line. Lines starting with "- " become a bullet list.
# The build script counts the characters for you.
cva_summary: |
  Mi trayectoria investigadora se centra en el estudio de los cambios climáticos abruptos, la dinámica de los mantos de hielo y los tipping points del sistema climático, combinando modelización numérica, análisis de datos paleoclimáticos y el desarrollo de nuevas aproximaciones para comprender la interacción entre la atmósfera, el océano y la criosfera. Tras formarme en Francia (Université Pierre et Marie Curie y Université de Versailles), desarrollé mi carrera postdoctoral y consolidación en la Universidad Complutense de Madrid, donde obtuve contratos competitivos como PICATA-CEI y Juan de la Cierva, hasta alcanzar mi posición actual como Científico Titular del CSIC en el Instituto de Geociencias (IGEO).

  Mi investigación ha contribuido de forma significativa a esclarecer los mecanismos que gobiernan los eventos de Heinrich, la inestabilidad del manto de hielo antártico y la sensibilidad del sistema climático a perturbaciones oceánicas y atmosféricas. He participado en proyectos internacionales como TiPEs (H2020) y ClimTIP (Horizon Europe), centrados en los puntos de no retorno del sistema terrestre. He sido Investigador Principal de los proyectos ICEAGE y CCRYTICAS, orientados a reducir la incertidumbre en la evolución futura de los mantos de hielo y a caracterizar los umbrales críticos del sistema climático y sus potenciales cascadas. Estas contribuciones han permitido avanzar en la comprensión de procesos clave para evaluar riesgos climáticos futuros y mejorar la representación de la criosfera en modelos climáticos. Mi producción científica incluye artículos en revistas de alto impacto en ciencias del clima, con aportaciones que han sido ampliamente utilizadas por la comunidad para interpretar la variabilidad glacial y los mecanismos de retroalimentación entre océano y hielo. Más allá de los resultados publicados, mi trabajo ha impulsado el desarrollo y aplicación de modelos de complejidad intermedia y herramientas numéricas que permiten explorar escenarios paleoclimáticos y evaluar la estabilidad de los mantos de hielo bajo condiciones cambiantes.

  He mantenido una intensa actividad de colaboración internacional, especialmente con centros de referencia como el LSCE (Francia), el Bjerknes Centre (Noruega) y grupos europeos especializados en modelización climática. Estas colaboraciones han favorecido la transferencia de conocimiento y la formación de jóvenes investigadores, contribuyendo a la consolidación de una comunidad interdisciplinar en torno al estudio de los tipping points climáticos. En el ámbito docente, he impartido asignaturas de grado, máster y doctorado en física, geofísica y climatología, y he dirigido tesis doctorales y trabajos fin de máster que han dado lugar a publicaciones y contribuciones relevantes. También he participado en proyectos de innovación docente orientados al desarrollo de laboratorios virtuales de meteorología y clima.

  Mi objetivo a medio y largo plazo es consolidar una línea de investigación que integre modelización climática, datos paleoclimáticos y análisis de estabilidad del sistema terrestre, con especial énfasis en la criosfera y su papel en los cambios abruptos. Aspiro a fortalecer la capacidad predictiva de los modelos y contribuir a la evaluación de riesgos climáticos asociados a posibles puntos de no retorno, aportando conocimiento clave para la toma de decisiones en un contexto de cambio global acelerado.

  - Publicaciones: 33 publicaciones internacionales con revisión por pares, 100% en el primer cuartil, destacando artículos de primer autor en Nature Geoscience y PNAS. Coautor en Nature Communications. Tres capítulos de libro.
  - Citas: ~1200 citas (>30 citas/artículo). Índice h: 17.
  - Sexenios: 3 (2008-2013, 2014-2019, 2020-2025 -en curso-).
  - Proyectos: Participación en 4 europeos (ERC, FP7, H2020), 6 nacionales y 5 franceses. Investigador Principal (IP) de 1 proyecto europeo (parte nacional) y 2 nacionales. Work Package Leader H2020.
  - Difusión de la investigación: >100 presentaciones (>75 de ellas orales, >10 invitadas), incluyendo los principales foros científicos internacionales de Ciencias de la Tierra (European Geosciences Union, EGU; American Geophysical Union, AGU; INQUA; etc.).
  - Internacionalización: Tesis doctoral desarrollada en Francia (LSCE-CNRS, Université Pierre et Marie Curie) y 1 postdoc en el Commissariat à l'Énergie Atomique (Saclay, Francia). Estancias breves (~1.5 años) en LGGE (Grenoble, Francia), PIK (Potsdam, Alemania), EPHE (Burdeos, Francia), Bjerknes Centre (Bergen, Noruega). Programas internacionales: ISMIP6-7, TIPMIP, CMIP, Impact Working Group (PAGES), Make Our Planet Great Again.
  - Formación de personal: Dirección de 8 tesis doctorales (5 en curso), 11 Trabajos Fin de Máster, 2 prácticas de empresa. Supervisor de estancias y contratos predoctorales y postdoctorales.
  - Docencia: Más de 5 años de docencia de grado y máster en universidades españolas y extranjeras.
  - Gestión: Co-IP del Grupo de Investigación Complutense PalMA-ice.

